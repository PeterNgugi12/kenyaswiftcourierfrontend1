<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Set the document title to the name of your application -->
    <title>CourierOS</title>
    <meta name="description" content="CourierOS - Delivery Management System" />
    <meta name="author" content="Your Company Name" />

    <!-- FAVICON - Add these lines -->
    <link rel="icon" type="image/png" href="/favicon.PNG" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.PNG" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.PNG" />
    <link rel="apple-touch-icon" href="/favicon.PNG" />
    
    <!-- Optional: For better compatibility, also add .ico version if you have it -->
    <!-- <link rel="icon" type="image/x-icon" href="/favicon.ico" /> -->

    <!-- Update og:image with your favicon/logo URL -->
    <meta property="og:title" content="CourierOS" />
    <meta property="og:description" content="CourierOS - Delivery Management System" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://yourdomain.com/favicon.PNG" /> <!-- Update with your actual domain -->

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="" />
    <meta name="twitter:image" content="https://yourdomain.com/favicon.PNG" /> <!-- Update with your actual domain -->
    
    <!-- Add organization schema for Google Search results -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "CourierOS",
      "url": "https://yourdomain.com",
      "logo": "https://yourdomain.com/favicon.PNG"
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
